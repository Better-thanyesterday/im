Name: message.rpc
ListenOn: 0.0.0.0:18082
Timeout: 0   
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: message.rpc

Kafka:
  Brokers:
    - 127.0.0.1:9092
  Producer:
    Acks: -1  # WaitForAll:leader 切换不丢已确认消息
    RetryMax: 3
    Compression: none
    MaxMessageBytes: 1048576
  Consumer:
    # msg/seq/inbox 合并为单 topic(im.msg.persist) 单消费组,bundle 单载荷按序落库
    GroupID:
      - msg-persist-group
    OffsetInitial: oldest
    SessionTimeout: 10s
    HeartbeatInterval: 3s


RedisCache:
    Host: 127.0.0.1:6379
    Type: node
    Pass: ""

Postgres:
  DataSource: postgres://postgres:root@127.0.0.1:5432/im_message?sslmode=disable  # TODO: 密码移出配置文件(环境变量/密管),生产启用 sslmode=require

Snowflake:
  WorkNode: 0  # 0=按 IP+PID 自动派生,多副本不撞号

UserRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: user.rpc

PushRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: push.rpc

GroupRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: group.rpc

FileRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: file.rpc

Telemetry:
  Name: message.rpc
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0
  Batcher: otlpgrpc
# 内建调试口:/metrics(普罗米修斯抓取)+ /debug/pprof(按需采样)+ /healthz
# 生产不对公网暴露,必要时 EnablePprof: false
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 6062
  EnableMetrics: true
  EnablePprof: true

# 持续 profiling(接 Pyroscope,启用前先起 pyroscope 服务,再取消注释)
# Profiling:
#   Name: message.rpc
#   ServerAddr: 127.0.0.1:4040
#   CpuThreshold: 700        # CPU >70% 才自动采样,平时零开销
#   UploadRate: 15s
