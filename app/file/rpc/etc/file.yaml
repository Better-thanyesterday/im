Name: file.rpc
ListenOn: 0.0.0.0:18005
Timeout: 0
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: file.rpc

Postgres:
  DataSource: postgres://postgres:root@127.0.0.1:5432/im_file?sslmode=disable  # TODO: 密码移出配置文件(环境变量/密管),生产启用 sslmode=require

Snowflake:
  WorkNode: 0  # 0=按 IP+PID 自动派生,多副本不撞号

Minio:
  # 必须带 scheme:AWS SDK 只接受合法 URI,"127.0.0.1:9000" 会在建立 bucket 时 panic
  Endpoint: http://127.0.0.1:9000
  AccessKey: root
  # MinIO 强制 root 密码 >=8 位,本地启动 MinIO 时用同一组凭据
  SecretKey: rootroot
  Bucket: im-files
  UseSSL: false

Telemetry:
  Name: file.rpc
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0
  Batcher: otlpgrpc

# 内建调试口:/metrics(普罗米修斯抓取)+ /debug/pprof(按需采样)+ /healthz
# 生产不对公网暴露,必要时 EnablePprof: false
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 6065
  EnableMetrics: true
  EnablePprof: true

# 持续 profiling(接 Pyroscope,启用前先起 pyroscope 服务,再取消注释)
# Profiling:
#   Name: file.rpc
#   ServerAddr: 127.0.0.1:4040
#   CpuThreshold: 700        # CPU >70% 才自动采样,平时零开销
#   UploadRate: 15s
