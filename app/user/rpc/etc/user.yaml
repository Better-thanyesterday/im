Name: user.rpc
ListenOn: 0.0.0.0:18884
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: user.rpc

Postgres:
  DataSource: postgres://postgres:root@127.0.0.1:5432/im_user?sslmode=disable  # TODO: 密码移出配置文件(环境变量/密管),生产启用 sslmode=require

Cache:
  - Host: 127.0.0.1:6379
    Type: node
    Pass:

RedisCache:
    Host: 127.0.0.1:6379
    Type: node
    Pass: ""

Snowflake:
  WorkNode: 0  # 0=按 IP+PID 自动派生,多副本不撞号
# 链路追踪:OTLP gRPC 上报 Jaeger(v2, OTLP receiver 4317)
Telemetry:
  Name: user.rpc
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0              # 生产建议 0.1
  Batcher: otlpgrpc
