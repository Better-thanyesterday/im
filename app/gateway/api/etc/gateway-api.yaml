Name: gateway-api
Host: 0.0.0.0
Port: 18888

GatewayRpc:
    Name: gateway-rpc        # ← 加上这行
    ListenOn: 0.0.0.0:18081

# 对外暴露地址（写入 Redis 供 Push 查询）
Gateway:
  GrpcAddr: "127.0.0.1:18081"  # 或 127.0.0.1:18081

Redis:
    Host: 127.0.0.1:6379
    Type: node
    Pass: ""

UserRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: user.rpc

MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: message.rpc
  Timeout: 0   
PushRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: push.rpc

GroupRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: group.rpc


Telemetry:
  Name: gateway-api
  Endpoint: 127.0.0.1:4317   # ← 去掉 http://
  Sampler: 1.0
  Batcher: otlpgrpc               # ← 必须是 grpc，不能写 otlpgrpc

# Token配置（与user服务共享Redis，TTL一致）
Token:
  DefaultTTL: 24h