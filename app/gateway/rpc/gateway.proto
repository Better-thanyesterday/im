syntax ="proto3";

package gateway;

option go_package= "./gateway";


message PushToConnReq {
  int64 user_id = 1;       // 目标用户 ID
  int32 device_type = 2;   // 目标设备：1-iOS 2-Android 3-Web 4-PC 5-小程序
  bytes payload = 3;       // 业务消息体（JSON/Protobuf 序列化后的裸字节）
                           // Gateway 会将其封装为 FramePush(0x10) 的 WebSocket 帧下发。
                           // 到达顺序契约:同会话跨消息不保证有序,客户端按 payload 内的
                           // seq_id 重排(push.proto PushMessage.seq_id),Gateway 只做透明转发
  int32 priority = 4;      // 0-普通 1-高优（如 @ 消息），Gateway 可做发送队列调度
}

message PushToConnResp {
  bool success = 1;        // 是否成功写入 WebSocket（连接存在且未写超时）
  string error_msg = 2;    // 失败原因，如 "conn_not_found" / "write_timeout" / "conn_closed"
}

service Gateway{
    rpc PushToConn(PushToConnReq) returns (PushToConnResp);
    // 批量推送:一次 RPC 推多个用户(群聊写扩散用,避免 O(N) 次 Deliver)
    rpc BatchPushToConn(BatchPushToConnReq) returns (BatchPushToConnResp);
    //rpc KickConn(KickConnReq) returns (KickConnResp); // 踢人，文档里有提到多端互踢
    //rpc GetConnStats(GetConnStatsReq) returns (GetConnStatsResp); // 连接统计，文档提到 /conn/stats
}

message BatchPushToConnReq {
    repeated int64 user_ids = 1; // 目标用户列表(其在本网关的全部在线设备都会收到)
    bytes payload = 2;           // 业务消息体,Gateway 统一封装为 FramePush(0x10) 帧下发
}

message BatchPushToConnResp {
    int32 success_count = 1;            // 成功收到推送的连接数
    repeated int64 failed_user_ids = 2; // 本网关上无在线设备/全部设备投递失败的用户
}

