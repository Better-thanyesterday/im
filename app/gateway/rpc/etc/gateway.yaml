Name: gateway.rpc
# GatewayRpc 是**具名字段**(zrpc.RpcServerConf),Name/ListenOn/Etcd 必须包在它自己的块里
GatewayRpc:
  Name: gateway.rpc
  ListenOn: 0.0.0.0:18001
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: gateway.rpc

# WS/HTTP 入口:客户端连 ws://<host>:18890/ws(带 Authorization: Bearer <token>)
# 注意:Config 里内嵌的是 rest.RestConf,其字段(Name/Host/Port/Timeout)必须写在**顶层**,
# 不能像这样包成 RestConf: 块 —— 否则启动即 "field Port is not set"
Host: 0.0.0.0
Port: 18890
Timeout: 0

# 上行消息转发到 message rpc
MsgRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: message.rpc

Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: ""

# 上下线事件广播(im.event.notify,生产者)
Kafka:
  Brokers:
    - 127.0.0.1:9092
  Producer:
    Acks: 1
    RetryMax: 3
    Compression: none
    MaxMessageBytes: 1048576
  # go-zero 的 mq.Config 要求 Producer/Consumer 两块都存在才通过校验
  Consumer:
    GroupID:
      - gateway-event-group
    OffsetInitial: latest
    SessionTimeout: 10s
    HeartbeatInterval: 3s

# 写入在线表供 push 直连。
# 写回环地址会被 normalizeAdvertiseAddr 自动替换成 AdvertiseHost() 的结果,
# 而它取的是"第一个非回环 IPv4"(不认默认路由接口),本机可能挑到 169.254.x.x
# 这类不可达地址 → push 按它投递会静默失败、实时推送全断。
# 所以这里显式写本机可达 IP;**换网络环境要同步改这一行**(或改用默认路由网卡)。
Gateway:
  GrpcAddr: "192.168.0.101:18001"
  BucketNum: 16

# 链路追踪:OTLP gRPC 上报 Jaeger(v2, OTLP receiver 4317)
Telemetry:
  Name: gateway.rpc
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0              # 生产建议 0.1
  Batcher: otlpgrpc

# 内建调试口:/metrics(普罗米修斯抓取)+ /debug/pprof(按需采样)+ /healthz
# 生产不对公网暴露,必要时 EnablePprof: false
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 6066
  EnableMetrics: true
  EnablePprof: true

# 持续 profiling(接 Pyroscope,启用前先起 pyroscope 服务,再取消注释)
# Profiling:
#   Name: gateway.rpc
#   ServerAddr: 127.0.0.1:4040
#   CpuThreshold: 700        # CPU >70% 才自动采样,平时零开销
#   UploadRate: 15s
