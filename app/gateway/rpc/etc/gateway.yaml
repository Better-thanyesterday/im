Name: gateway.rpc
ListenOn: 0.0.0.0:18001
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: gateway.rpc

# WS/HTTP 入口:客户端连 ws://<host>:18890/ws(带 Authorization: Bearer <token>)
RestConf:
  Host: 0.0.0.0
  Port: 18890
  Timeout: 0

# 上行消息转发到 message rpc
MsgRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: message.rpc

Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: ""

# 上下线事件广播(im.event.notify,生产者)
Kafka:
  Brokers:
    - 127.0.0.1:9092
  Producer:
    Acks: 1
    RetryMax: 3
    Compression: none
    MaxMessageBytes: 1048576

# 写入在线表供 push 直连;127.0.0.1 会在启动时自动替换为本机对外 IP
Gateway:
  GrpcAddr: "127.0.0.1:18001"
  BucketNum: 16

# 链路追踪:OTLP gRPC 上报 Jaeger(v2, OTLP receiver 4317)
Telemetry:
  Name: gateway.rpc
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0              # 生产建议 0.1
  Batcher: otlpgrpc

# 内建调试口:/metrics(普罗米修斯抓取)+ /debug/pprof(按需采样)+ /healthz
# 生产不对公网暴露,必要时 EnablePprof: false
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 6066
  EnableMetrics: true
  EnablePprof: true

# 持续 profiling(接 Pyroscope,启用前先起 pyroscope 服务,再取消注释)
# Profiling:
#   Name: gateway.rpc
#   ServerAddr: 127.0.0.1:4040
#   CpuThreshold: 700        # CPU >70% 才自动采样,平时零开销
#   UploadRate: 15s
