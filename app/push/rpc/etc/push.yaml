Name: push.rpc
ListenOn: 0.0.0.0:18883
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: push.rpc

Kafka:
  Brokers:
    - 127.0.0.1:9092  # 多机部署时改为 Kafka 集群地址
  Topic: im.msg.persist        # 消息持久化 topic
  Group: msg-persist-group     # Consumer 用，Producer 不用
  Offset: latest
  Consumers: 8
  Processors: 8
  ForceCommit: false

RedisCache:
    Host: 127.0.0.1:6379
    Type: node
    Pass: ""

Postgres:
  DataSource: postgres://postgres:root@127.0.0.1:5432/im_message?sslmode=disable  # TODO: 密码移出配置文件(环境变量/密管),生产启用 sslmode=require

Snowflake:
  WorkNode: 0  # 0=按 IP+PID 自动派生,多副本不撞号

UserRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: user.rpc

MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: message.rpc

GroupRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: group.rpc

GatewayRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: gateway.rpc