Name: push.rpc
ListenOn: 0.0.0.0:18883
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: push.rpc

Kafka:
  Brokers:
    - 127.0.0.1:9092  # 多机部署时改为 Kafka 集群地址
  Topic: im.msg.persist        # 消息持久化 topic
  Group: msg-persist-group     # Consumer 用，Producer 不用
  Offset: latest
  Consumers: 8
  Processors: 8
  ForceCommit: false

RedisCache:
    Host: 127.0.0.1:6379
    Type: node
    Pass: ""

Postgres:
  DataSource: postgres://postgres:root@127.0.0.1:5432/im_message?sslmode=disable  # TODO: 密码移出配置文件(环境变量/密管),生产启用 sslmode=require

Snowflake:
  WorkNode: 0  # 0=按 IP+PID 自动派生,多副本不撞号

UserRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: user.rpc

MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: message.rpc

GroupRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: group.rpc

GatewayRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: gateway.rpc
# 链路追踪:OTLP gRPC 上报 Jaeger(v2, OTLP receiver 4317)
Telemetry:
  Name: push.rpc
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0              # 生产建议 0.1
  Batcher: otlpgrpc

# 内建调试口:/metrics(普罗米修斯抓取)+ /debug/pprof(按需采样)+ /healthz
# 生产不对公网暴露,必要时 EnablePprof: false
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 6064
  EnableMetrics: true
  EnablePprof: true

# 持续 profiling(接 Pyroscope,启用前先起 pyroscope 服务,再取消注释)
# Profiling:
#   Name: push.rpc
#   ServerAddr: 127.0.0.1:4040
#   CpuThreshold: 700        # CPU >70% 才自动采样,平时零开销
#   UploadRate: 15s
